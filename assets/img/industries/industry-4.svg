<svg width="160" height="110" viewBox="0 0 160 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Base Shadow -->
                    <ellipse cx="80" cy="94" rx="54" ry="14" fill="#0f172a" opacity="0.1"/>
                    <!-- Stacked 3D Colorful Books -->
                    <!-- Book 1 (Rose/Magenta) -->
                    <polygon points="48,74 80,58 112,74 80,90" fill="#f43f5e"/>
                    <polygon points="48,74 80,90 80,97 48,81" fill="#be123c"/>
                    <polygon points="112,74 80,90 80,97 112,81" fill="#9f1239"/>
                    <!-- Book 2 (Warm Yellow) -->
                    <polygon points="52,65 80,50 108,65 80,80" fill="#fbbf24"/>
                    <polygon points="52,65 80,80 80,87 52,72" fill="#d97706"/>
                    <polygon points="108,65 80,80 80,87 108,72" fill="#b45309"/>
                    <!-- Book 3 (Emerald Green) -->
                    <polygon points="55,56 80,42 105,56 80,70" fill="#10b981"/>
                    <polygon points="55,56 80,70 80,76 55,62" fill="#047857"/>
                    <polygon points="105,56 80,70 80,76 105,62" fill="#065f46"/>
