                    <rect x="71" y="22" width="18" height="16" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
                    <circle cx="76" cy="30" r="2.5" fill="#007bff"/>
                    <circle cx="84" cy="30" r="2.5" fill="#007bff"/>
                    <!-- Antenna -->
                    <line x1="80" y1="22" x2="80" y2="14" stroke="#64748b" stroke-width="2.4"/>
                    <circle cx="80" cy="13" r="2.8" fill="#38bdf8"/>
                    <!-- Body & Blue Tablet -->
                    <rect x="74" y="38" width="12" height="10" rx="3" fill="#94a3b8"/>
