                    <polygon points="56,44 80,56 80,62 56,50" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
                    <polygon points="108,44 80,56 80,62 108,50" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.2"/>
