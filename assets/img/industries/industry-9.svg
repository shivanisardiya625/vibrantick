                    <polygon points="54,58 80,45 80,72 54,85" fill="url(#c9VillaWall)" stroke="#cbd5e1" stroke-width="1.2"/>
                    <polygon points="80,45 110,58 110,85 80,72" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.2"/>
