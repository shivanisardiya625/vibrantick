<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad_java" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <linearGradient id="cardGrad_java" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_java" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Pattern -->
    <pattern id="grid_java" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Base with Rounded Corners -->
  <rect width="600" height="440" rx="16" fill="url(#bgGrad_java)"/>
  <rect width="600" height="440" rx="16" fill="url(#grid_java)"/>
  <rect width="600" height="440" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="300" cy="190" r="130" fill="#E76F00" opacity="0.12" filter="url(#glow_java)"/>

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="600" height="46" rx="16" fill="rgba(10, 20, 38, 0.85)"/>
  <rect x="0" y="32" width="600" height="14" fill="rgba(10, 20, 38, 0.85)"/>
  <line x1="0" y1="46" x2="600" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="28" cy="23" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="44" cy="23" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="60" cy="23" r="5" fill="#10B981" opacity="0.85"/>

  <!-- Window Title -->
  <text x="82" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="rgba(255, 255, 255, 0.75)" letter-spacing="0.5">
    VIBRANTICK CORE // JAVA ARCHITECTURE
  </text>

  <!-- Live Status Badge on Right -->
  <rect x="442" y="14" width="136" height="20" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
  <circle cx="454" cy="24" r="3.5" fill="#10B981"/>
  <text x="464" y="27.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#10B981" letter-spacing="0.4">
    VERIFIED STACK
  </text>

  <!-- Center Architecture Showcase Circle -->
  <g transform="translate(300, 180)">
    <!-- Outer dashed rotating orbital circle -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#E76F00" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
    <!-- Glowing circle badge -->
    <circle cx="0" cy="0" r="54" fill="#0E1E38" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" filter="url(#glow_java)"/>
    <!-- Inner icon centering -->
    <g transform="translate(-32, -32)">
      <svg viewBox="0 0 128 128" width="64" height="64"><path fill="#EA2D2E" d="M46.7 91.5s-4.6 2.7 3.3 3.6c9.6 1.1 15.2 1 26.5-.9 0 0 3.7 2.3 8.8 4.3-24.8 10.3-55.7-1.4-38.6-7m3.4-14.7s-5.3 3.8 2.6 4.7c10.8 1.2 19.2 1.4 34.3-1.6 0 0 2.5 2.1 6.3 3.6-28.6 8.3-60.8 1.1-43.2-6.7"/><path fill="#5382A1" d="M72.2 46.2c4.8 5.5-1.3 10.7-1.3 10.7s12.3-6.3 6.6-14.3c-5.5-7.7-10.4-11.6 14.1-24.6-24.8 6.7-25.2 19.6-19.4 28.2m18.7 36.1c5.4-4.4 7.3-8.3 7.3-8.3s-2.1 1.6-6 3.1c-13.6 5.3-38.4 5.9-54 1.2-1.9-.6-1.5-1.7-1.5-1.7s-.6.9.8 1.7c15.8 8.8 42.1 6.8 53.4 1M66.4 1c7.2 9.1-5.5 16.7-5.5 16.7s11.5-6.6 6.3-15c-5.1-8.2 7.7-14.7 18.7-22.7C74.6-9.8 60.5-6.5 66.4 1"/><path fill="#EA2D2E" d="M96.7 101.4c-12.7 9.8-58.4 10.5-69.6.7-3.9-3.4 2.8-5.6 4.7-6.1-1.9-.7-11.8 2.5-7.5 7.7 11.2 13.5 77.2 11.8 88.5-1.4 3-3.6-7.8-3.7-16.1-.9"/></svg>
    </g>
  </g>

  <!-- Subtitle Tag Underneath Icon -->
  <text x="300" y="265" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">
    Java Enterprise Engineering
  </text>
  <text x="300" y="283" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="rgba(255, 255, 255, 0.6)">
    Spring Boot 3 &amp; High-Concurrency Cloud Systems
  </text>

  <!-- Left Feature Box 1 -->
  <g transform="translate(26, 75)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_java)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#E76F00" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#E76F00">01</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Architecture</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">Spring Boot Microservices</text>
  </g>

  <!-- Left Feature Box 2 -->
  <g transform="translate(26, 142)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_java)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#E76F00" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#E76F00">02</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Capability</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">Virtual Threads (Project Loom)</text>
  </g>

  <!-- Right Feature Box 1 -->
  <g transform="translate(394, 75)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_java)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#5382A1" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#5382A1">03</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Delivery Focus</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">Kafka Event Streaming</text>
  </g>

  <!-- Right Feature Box 2 -->
  <g transform="translate(394, 142)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_java)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#5382A1" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#5382A1">04</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Optimization</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">Zero-Allocation Tuning</text>
  </g>

  <!-- Bottom Metric & Reliability Strip -->
  <g transform="translate(26, 316)">
    <rect width="548" height="98" rx="12" fill="rgba(15, 28, 54, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- 3 Mini Stats Inside Strip -->
    <g transform="translate(30, 24)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">16+ <tspan fill="#007BFF" font-size="13">Yrs</tspan></text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.65)">Engineering Tenure</text>
    </g>

    <line x1="190" y1="20" x2="190" y2="78" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <g transform="translate(215, 24)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">99.9% <tspan fill="#007BFF" font-size="13">SLA</tspan></text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.65)">Production Reliability</text>
    </g>

    <line x1="375" y1="20" x2="375" y2="78" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <g transform="translate(400, 24)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">45K TPS <tspan fill="#E76F00" font-size="11">BENCHMARK</tspan></text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.65)">THROUGHPUT</text>
    </g>
  </g>
</svg>
