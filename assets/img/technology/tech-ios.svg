<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad_ios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="50%" stop-color="#07101E"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <linearGradient id="cardGrad_ios" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_ios" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Pattern -->
    <pattern id="grid_ios" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Base with Rounded Corners -->
  <rect width="600" height="440" rx="16" fill="url(#bgGrad_ios)"/>
  <rect width="600" height="440" rx="16" fill="url(#grid_ios)"/>
  <rect width="600" height="440" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="300" cy="190" r="130" fill="#007AFF" opacity="0.12" filter="url(#glow_ios)"/>

  <!-- Top Window Header Bar -->
  <rect x="0" y="0" width="600" height="46" rx="16" fill="rgba(10, 20, 38, 0.85)"/>
  <rect x="0" y="32" width="600" height="14" fill="rgba(10, 20, 38, 0.85)"/>
  <line x1="0" y1="46" x2="600" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="28" cy="23" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="44" cy="23" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="60" cy="23" r="5" fill="#10B981" opacity="0.85"/>

  <!-- Window Title -->
  <text x="82" y="27" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="rgba(255, 255, 255, 0.75)" letter-spacing="0.5">
    VIBRANTICK CORE // IOS ARCHITECTURE
  </text>

  <!-- Live Status Badge on Right -->
  <rect x="442" y="14" width="136" height="20" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
  <circle cx="454" cy="24" r="3.5" fill="#10B981"/>
  <text x="464" y="27.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#10B981" letter-spacing="0.4">
    VERIFIED STACK
  </text>

  <!-- Center Architecture Showcase Circle -->
  <g transform="translate(300, 180)">
    <!-- Outer dashed rotating orbital circle -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="#007AFF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>
    <!-- Glowing circle badge -->
    <circle cx="0" cy="0" r="54" fill="#0E1E38" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" filter="url(#glow_ios)"/>
    <!-- Inner icon centering -->
    <g transform="translate(-32, -32)">
      <svg viewBox="0 0 170 170" fill="#FFFFFF" width="64" height="64"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.6-7.7-11.71-13.97-5.55-8.48-9.97-17.7-13.26-27.65-3.29-9.96-4.94-19.6-4.94-28.93 0-13.49 3.5-24.6 10.5-33.34 7-8.75 15.74-13.21 26.23-13.38 4.8 0 10.15 1.25 16.05 3.76 5.9 2.5 9.77 3.86 11.61 4.07 1.84-.21 5.86-1.62 12.06-4.23 6.2-2.61 11.51-3.8 15.93-3.56 12.28.64 21.96 5.53 29.03 14.68-10.74 6.5-16.01 15.54-15.8 27.13.21 9.07 3.64 16.66 10.3 22.78 4.49 4.13 9.77 7.02 15.86 8.67-2.34 6.78-4.95 13.1-7.85 18.96zM119.22 33.64c0-7.39 2.66-14.28 7.97-20.67 5.31-6.39 11.95-10.45 19.92-12.18.21 1.08.32 2.1.32 3.07 0 7.39-2.73 14.34-8.18 20.85-5.46 6.51-12.15 10.43-20.03 11.77z"/></svg>
    </g>
  </g>

  <!-- Subtitle Tag Underneath Icon -->
  <text x="300" y="265" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">
    iOS Enterprise Engineering
  </text>
  <text x="300" y="283" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="rgba(255, 255, 255, 0.6)">
    SwiftUI &amp; Apple Silicon Native Ecosystem
  </text>

  <!-- Left Feature Box 1 -->
  <g transform="translate(26, 75)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_ios)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#007AFF" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#007AFF">01</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Architecture</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">SwiftUI Declarative UI</text>
  </g>

  <!-- Left Feature Box 2 -->
  <g transform="translate(26, 142)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_ios)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#007AFF" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#007AFF">02</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Capability</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">Async/Await Concurrency</text>
  </g>

  <!-- Right Feature Box 1 -->
  <g transform="translate(394, 75)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_ios)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#5856D6" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#5856D6">03</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Delivery Focus</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">SwiftData &amp; CoreData</text>
  </g>

  <!-- Right Feature Box 2 -->
  <g transform="translate(394, 142)">
    <rect width="180" height="54" rx="10" fill="url(#cardGrad_ios)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="22" cy="27" r="10" fill="#5856D6" opacity="0.2"/>
    <text x="22" y="31" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#5856D6">04</text>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Optimization</text>
    <text x="42" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.65)">Metal Graphics Acceleration</text>
  </g>

  <!-- Bottom Metric & Reliability Strip -->
  <g transform="translate(26, 316)">
    <rect width="548" height="98" rx="12" fill="rgba(15, 28, 54, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- 3 Mini Stats Inside Strip -->
    <g transform="translate(30, 24)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">16+ <tspan fill="#007BFF" font-size="13">Yrs</tspan></text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.65)">Engineering Tenure</text>
    </g>

    <line x1="190" y1="20" x2="190" y2="78" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <g transform="translate(215, 24)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">99.9% <tspan fill="#007BFF" font-size="13">SLA</tspan></text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.65)">Production Reliability</text>
    </g>

    <line x1="375" y1="20" x2="375" y2="78" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

    <g transform="translate(400, 24)">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">99.95% <tspan fill="#007AFF" font-size="11">BENCHMARK</tspan></text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="rgba(255, 255, 255, 0.65)">APP STORE VITALS</text>
    </g>
  </g>
</svg>
